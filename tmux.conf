# clamp's isolated tmux server config.
# Loaded only via `tmux -L clamp -f <this file>` so it never affects your
# regular tmux server.

# --- terminal & input ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Don't auto-rename windows from the running command.
set -g allow-rename off
setw -g automatic-rename off

# When the wrapped claude exits, the pane closes (no "[exited]" lingering).
set -g remain-on-exit off

# --- status bar ---
# Left:   ⛓ clamp
# Center: C-g  command palette
# Right:  <cwd>  <git-branch>  <git-status>  HH:MM
#
# The cwd/branch/status block is rendered by lib/status-line.sh, fed the
# current pane's working dir. tmux re-evaluates #(...) every status-interval.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify centre

set -g status-style "bg=#1f2335,fg=#a9b1d6"

set -g status-left-length 60
set -g status-left  "#[fg=#7aa2f7,bold] ⛓ clamp #[fg=#e0af68,bold]C-g#[fg=#a9b1d6,nobold] palette #[default]"

# Generous length so long paths + dirty repos don't get truncated.
set -g status-right-length 200
# Inside #(...), tmux first expands #{...} (format directives) then runs
# the result via /bin/sh — so $CLAMP_LIB is shell-expanded by sh from the
# server's global env (set by `clamp start`). #{pane_current_path} is the
# format-time substitution for the active pane's cwd.
set -g status-right "#($CLAMP_LIB/status-line.sh '#{pane_current_path}')  #[fg=#7dcfff]%H:%M#[default] "

# Window list — one entry per running thread. Names are set by clamp:
# "new" for fresh threads, "handoff" for handoffs, sid:8 for resumed threads.
set -g window-status-separator " "
set -g window-status-format         "#[fg=#565f89]#I:#W#[default]"
set -g window-status-current-format "#[fg=#1f2335,bg=#7aa2f7,bold] #I:#W #[default]"

# Subtle pane border
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# The C-g (or whatever CLAMP_HOTKEY is set to) binding is installed at
# runtime by `clamp start` because it needs to reference the absolute path to
# the clamp script. See bin/clamp:install_bindings().
