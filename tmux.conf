# clamp's isolated tmux server config.
# Loaded only via `tmux -L clamp -f <this file>` so it never affects your
# regular tmux server.

# --- terminal & input ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Don't auto-rename windows from the running command.
set -g allow-rename off
setw -g automatic-rename off

# When the wrapped claude exits, the pane closes (no "[exited]" lingering).
set -g remain-on-exit off

# --- status bar ---
# Left:   ⛓ clamp
# Center: C-g  command palette
# Right:  HH:MM
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify centre

set -g status-style "bg=#1f2335,fg=#a9b1d6"

set -g status-left-length 40
set -g status-left  "#[fg=#7aa2f7,bold] ⛓ clamp #[default]"

set -g status-right-length 40
set -g status-right "#[fg=#7dcfff] %H:%M #[default]"

# The centered "window list" position is what tmux puts in the middle of the
# status bar. We hide the actual window list and put our hotkey hint there
# instead.
set -g window-status-separator ""
set -g window-status-format         "#[fg=#e0af68,bold]C-g#[fg=#a9b1d6,nobold] command palette"
set -g window-status-current-format "#[fg=#e0af68,bold]C-g#[fg=#a9b1d6,nobold] command palette"

# Subtle pane border
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# The C-g (or whatever CLAMP_HOTKEY is set to) binding is installed at
# runtime by `clamp start` because it needs to reference the absolute path to
# the clamp script. See bin/clamp:install_bindings().
